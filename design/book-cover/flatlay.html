<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:768px;height:512px;overflow:hidden;background:#f3f1f0}
  .sheet{position:absolute;left:-40px;top:-40px}
  .grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .48  0 0 0 .22 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
  .light{position:absolute;inset:0;background:radial-gradient(75% 65% at 28% 22%,#ffffffa6 0,#fff0 62%),linear-gradient(160deg,#fff0 55%,#d8cfcd40 100%)}
  .book{position:absolute;left:250px;top:44px;width:276px;height:414px;transform:rotate(-7deg)}
  .edge{position:absolute;inset:0;transform:translate(-7px,6px);background:linear-gradient(90deg,#ec9db3,#f3b4c6);border-radius:3px 2px 2px 4px;box-shadow:0 26px 34px -10px #3c242c5c,0 6px 10px #3c242c24,-12px 34px 56px -22px #3c242c3d}
  .edge::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,#ffffff2a 0 1px,#0000 1px 3px);opacity:.5}
  .cover{position:absolute;inset:0;background:url(cover.png) center/cover;border-radius:2px 3px 3px 2px;box-shadow:inset 3px 0 4px -2px #00000026}
  .cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,#ffffff3d 0,#fff0 38%,#fff0 70%,#3c242c14 100%)}
  .crease{position:absolute;left:9px;top:0;bottom:0;width:2px;background:linear-gradient(#0000,#3c242c1f,#0000)}
</style></head><body>
<!-- Soft cotton folds: blurred shadow and highlight strokes on white. -->
<svg class="sheet" width="848" height="592" viewBox="0 0 848 592" fill="none" stroke-linecap="round">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="848" height="592" fill="#f4f2f1"/>
  <g filter="url(#softer)" stroke="#d6cecc" stroke-opacity=".75">
    <path d="M-20 120 C140 80 260 150 420 110 S700 60 880 120" stroke-width="44"/>
    <path d="M-20 300 C120 250 220 340 360 300" stroke-width="54"/>
    <path d="M560 380 C660 340 760 420 880 380" stroke-width="50"/>
    <path d="M40 560 C200 500 360 590 520 540 S760 500 900 560" stroke-width="48"/>
  </g>
  <g filter="url(#soft)" stroke="#ffffff">
    <path d="M-20 92 C140 52 260 122 420 82 S700 32 880 92" stroke-width="22"/>
    <path d="M-20 272 C120 222 220 312 360 272" stroke-width="26"/>
    <path d="M560 352 C660 312 760 392 880 352" stroke-width="24"/>
    <path d="M40 532 C200 472 360 562 520 512 S760 472 900 532" stroke-width="22"/>
    <path d="M640 40 C700 120 690 220 760 300" stroke-width="20"/>
  </g>
  <g filter="url(#soft)" stroke="#cfc6c4" stroke-opacity=".7">
    <path d="M656 58 C716 138 706 238 776 318" stroke-width="16"/>
    <path d="M120 400 C160 440 150 500 200 560" stroke-width="18"/>
  </g>
  <g filter="url(#soft)" stroke="#ffffff"><path d="M104 386 C144 426 134 486 184 546" stroke-width="16"/></g>
</svg>
<div class="light"></div><div class="grain"></div>
<div class="book"><div class="edge"></div><div class="cover"><div class="crease"></div></div></div>
</body></html>
