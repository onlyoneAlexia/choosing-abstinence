<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=DM+Sans:wght@500;700&display=block" rel="stylesheet">
<style>
  :root{--pink:#f7c9d5;--rose:#cf4a73;--rose-dark:#b73a62;--ink:#3a2028;--wine:#4b0717}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:800px;height:1200px;background:transparent}
  .cover{position:relative;width:800px;height:1200px;overflow:hidden;background:
    radial-gradient(120% 80% at 30% 20%,#fbd6df 0,#f7c9d5 55%,#f2bccb 100%)}
  /* faint paper grain */
  .cover::before{content:"";position:absolute;inset:0;opacity:.18;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .35  0 0 0 0 .42  0 0 0 .55 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
  .author{position:absolute;top:62px;left:0;right:0;text-align:center;font:600 31px/1 'Cormorant Garamond',serif;letter-spacing:5px;color:#fff;-webkit-text-stroke:1.1px var(--rose-dark);paint-order:stroke fill}
  .title{position:absolute;top:128px;left:0;right:0;text-align:center;color:var(--rose);font-family:'Cormorant Garamond',serif;font-weight:700;line-height:.86;letter-spacing:1px}
  .title .l1{display:block;font-style:italic;font-size:134px;letter-spacing:2px;transform:translateX(-10px)}
  .title .l2{display:block;font-size:103px;letter-spacing:0;margin-top:8px}
  .subtitle{position:absolute;top:382px;left:0;right:0;text-align:center;font:700 15px/1 'DM Sans',sans-serif;letter-spacing:4.2px;color:var(--wine);text-transform:uppercase}
  .subtitle i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rose);margin:0 12px 2px;vertical-align:middle}
  .list{position:absolute;top:446px;left:88px;font:600 44px/1.08 'Caveat',cursive;color:var(--ink)}
  .list s{text-decoration:none;position:relative;display:inline-block}
  .list s::after{content:"";position:absolute;left:-6px;right:-8px;top:54%;height:3.2px;background:#d6365f;border-radius:3px;transform:rotate(-2.5deg)}
  .list .kept{position:relative;display:inline-block;font-size:52px;font-weight:700;color:var(--wine)}
  .list .kept::after{content:"";position:absolute;left:-4px;right:-10px;bottom:2px;height:12px;border-bottom:3.2px solid #d6365f;border-radius:0 0 60% 40%/0 0 100% 100%}
  .tag{position:absolute;top:520px;left:470px;font:600 40px/0.95 'Caveat',cursive;color:var(--ink);transform:rotate(-8deg);text-align:center}
  .heart{position:absolute;width:30px;height:30px;color:var(--rose)}
  .scene{position:absolute;left:0;bottom:0;width:800px;height:600px}
</style></head>
<body><div class="cover">

  <svg class="heart" style="top:66px;left:734px;width:22px;transform:rotate(-20deg)" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M16 27C9 21.5 4 17.4 4 11.6 4 8 6.8 5.3 10.2 5.3c2.4 0 4.5 1.4 5.8 3.5 1.3-2.1 3.4-3.5 5.8-3.5 3.4 0 6.2 2.7 6.2 6.3 0 5.8-5 9.9-12 15.4z"/></svg>

  <div class="subtitle">Your body<i></i>Your boundaries<i></i>Your choice</div>
  <div class="list"><s>prove you love me</s><br><s>just this once</s><br><span class="kept">my choice.</span></div>
  <div class="tag">the guide &amp;<br>workbook</div>

</div></body></html>
